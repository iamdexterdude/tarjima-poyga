<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Unit 1–2 Test Race</title>
<meta name="description" content="A timed grammar test race on a / an and plurals (New Round-Up 1, Units 1 and 2).">
<meta name="theme-color" content="#0A1230">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='6' y='6' width='20' height='20' transform='rotate(45 16 16)' fill='%231C3FAA' stroke='%230E1A3F' stroke-width='3'/%3E%3Crect x='11' y='11' width='10' height='10' transform='rotate(45 16 16)' fill='%23F0B429'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="race.css">
<link rel="stylesheet" href="test.css">
</head>
<body>
<div class="fx" aria-hidden="true">
  <div class="fx-stars"></div>
  <div class="fx-glow"></div>
  <div class="fx-speed" id="speed"></div>
  <div class="fx-vig"></div>
</div>
<div class="wrap">
  <header class="bar">
    <button class="brand" data-act="home" aria-label="Unit test home"><i></i>Unit Test Race</button>
    <nav>
      <button class="chip" data-act="go-lobby">Test</button>
      <button class="chip" data-act="go-lb">Leaderboard</button>
      <button class="chip" data-act="go-hist">History</button>
      <button class="chip ico" data-act="sound" id="soundBtn" aria-label="Sound on or off"></button>
      <button class="chip ico" data-act="theme" aria-label="Switch light or dark theme"></button>
    </nav>
  </header>
  <main id="app" aria-live="polite"></main>
</div>
<canvas id="confetti" hidden></canvas>
<script src="../js/sound.js"></script>
<script src="../js/voice.js"></script>
<script src="js/test-bank.js"></script>
<script src="js/test-app.js"></script>
</body>
</html>
